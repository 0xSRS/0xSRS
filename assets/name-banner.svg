<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 150" width="760" height="150" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .glitch-text {
        font-family: 'Segoe UI', 'Arial', sans-serif;
        font-weight: 900;
        font-size: 74px;
        letter-spacing: 10px;
      }
      .layer { mix-blend-mode: screen; }
    </style>
  </defs>

  <rect width="760" height="150" fill="#0d1117"/>

  <!-- glitch scanline accents -->
  <rect x="0" y="18" width="760" height="2" fill="#233042"/>
  <rect x="0" y="130" width="760" height="2" fill="#233042"/>

  <g transform="translate(48,100)">
    <text class="glitch-text layer" x="-3" y="-2" fill="#00e5ff" opacity="0.85">SURYANSH</text>
    <text class="glitch-text layer" x="3" y="2" fill="#ff2fb0" opacity="0.85">SURYANSH</text>
    <text class="glitch-text layer" x="2" y="-3" fill="#ffb300" opacity="0.7">SURYANSH</text>
    <text class="glitch-text" x="0" y="0" fill="#f5f7fa">SURYANSH</text>
  </g>

  <!-- small glitch tick marks -->
  <rect x="60" y="34" width="26" height="4" fill="#00e5ff" opacity="0.8"/>
  <rect x="640" y="118" width="26" height="4" fill="#ff2fb0" opacity="0.8"/>
</svg>
